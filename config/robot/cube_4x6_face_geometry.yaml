schema_version: 1
units: meter
geometry:
  cube_size_m:
  - 0.03
  - 0.03
  - 0.03
  cube_half_extent_m: 0.015
  apriltag_black_square_size_m: 0.02
  object_frame:
    origin: cube geometric center
    axis_convention:
      +Z: AprilTag face outward normal
      -Z: solid color face outward normal
      +X: first trash face shown after AprilTag in the supplied video
      +Y: second trash face shown after AprilTag
      -X: third trash face shown after AprilTag
      -Y: fourth trash face shown after AprilTag
    face_orientation_definition: orientation_xyzw rotates a face-local frame whose +Z axis is the outward surface normal into
      cube frame
  vertices_xyz_m:
  - - -0.015
    - -0.015
    - -0.015
  - - 0.015
    - -0.015
    - -0.015
  - - 0.015
    - 0.015
    - -0.015
  - - -0.015
    - 0.015
    - -0.015
  - - -0.015
    - -0.015
    - 0.015
  - - 0.015
    - -0.015
    - 0.015
  - - 0.015
    - 0.015
    - 0.015
  - - -0.015
    - 0.015
    - 0.015
  apriltag_local_corners_on_plus_z_xyz_m:
    corner_0:
    - -0.01
    - 0.01
    - 0.015
    corner_1:
    - 0.01
    - 0.01
    - 0.015
    corner_2:
    - 0.01
    - -0.01
    - 0.015
    corner_3:
    - -0.01
    - -0.01
    - 0.015
notes:
- All XYZ values are in each cube's local object frame, not base_link or camera frame.
- The face centers are exactly 15 mm from the cube center because the physical cube is 30 mm per side.
- The AprilTag black inner square is modeled as 20 mm x 20 mm, centered on the +Z face.
- Trash-face ring order was inferred from the order/adjacency visible in the four supplied videos. Verify once against the
  physical cubes before treating semantic axis labels as permanent calibration.
- To obtain camera/world coordinates, transform these local points by T_camera_cube or T_base_cube.
