# Tam camera o pose quan sat (de fast-path pixel->base, tranh loi optical TF).
# REV3: start_v2 joints [0.0175,-0.4538,1.4312,1.5708] -> FK cam (0.112,0.003,0.215),
# cao 170mm tren ban -> FOV ~121x93 (scale tu fx/fy).
