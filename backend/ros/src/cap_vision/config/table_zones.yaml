# table_z: trung binh 4 lan cham TCP xuong tham 2026-09-22:
#   green (0.036,0.161,0.051), yellow (0.128,0.165,0.046),
#   red (0.117,-0.173,0.046), blue (0.034,-0.156,0.038) -> mean z=0.0452.
#   Do lech 13mm giua max-min (tay cham bang mat + TCP nghien theo goc),
#   lay 0.045, pick cao hon 5mm an toan. Top-down nen loi XY do z khong dang ke.
