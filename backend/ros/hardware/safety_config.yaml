# safety_config.yaml — SINGLE SOURCE OF TRUTH cho tay thật DOFBOT-SE.
# Mọi script trong hardware/ (safety_gate, check_stm32, arm_hw_bridge) đọc file này.
# Đơn vị: rad cho joint MoveIt, độ cho servo Arm_Lib, giây cho thời gian.
#
# Ánh xạ đã VERIFY với dofbot_driver (dofbot_ws) + Arm_Lib 0.0.5:
#   servo_s1      = deg(rad_arm1) + 90            (clip 0..180)
#   servo_s2..s4  = 90 - deg(rad)  (driver gốc gửi 180-x, Arm_Lib đảo lần nữa
#                   -> góc vật lý = 90+deg, trùng URDF; fix đảo ngược 2026-09-21)
#   servo_s5      = deg(rad_arm5) + 90            (clip 0..270; URDF ±90deg -> 0..180)
#   servo_s6 grip = interp(deg(Rlink1)+90 in [90,180] -> [30,180])
# rad=0 <-> servo=90 là HOME giữa hành trình. Đừng đổi công thức nếu chưa đo lại.

serial:
  # STM32 trên image Yahboom tạo symlink /dev/myserial -> ttyUSB*.
  # Khi cắm tay thật vào máy này mà chưa có udev rule, dùng /dev/ttyUSB0.
  ports: ["/dev/myserial", "/dev/ttyUSB0"]
  baud: 115200
  open_timeout_sec: 5.0

# Giới hạn phần cứng (độ servo). s1-s4,s6: 0-180; s5: 0-270 (Arm_Lib).
servo_limits_deg:
  s1: [0.0, 180.0]
  s2: [0.0, 180.0]
  s3: [0.0, 180.0]
  s4: [0.0, 180.0]
  s5: [0.0, 270.0]
  s6: [30.0, 180.0]   # gripper: 30=mở hết, 180=đóng hết (theo interp của driver gốc)

# Giới hạn planning (rad, từ URDF dofbot.urdf) + software safety margin.
# Tư duy real_world_plan.md: hardware limit > controller limit > planning limit > vùng chạy thường.
urdf_limits_rad:
  arm1_Joint: [-1.57, 1.57]
  arm2_Joint: [-1.57, 1.57]
  arm3_Joint: [-1.57, 1.57]
  arm4_Joint: [-1.57, 1.57]
  arm5_Joint: [-1.57, 1.57]
  Rlink1_Joint: [0.0, 1.57]
# Margin chừa lại ở 2 đầu limit khi plan (đừng dùng sát biên cơ khí).
joint_limit_margin_rad: 0.02
# Readback is quantized to whole servo degrees.  A physical 90 degree endpoint
# becomes pi/2 rad while the vendor URDF rounds the same endpoint to 1.57.
# Only measured state may be snapped by this tolerance; commanded trajectory
# points are never clamped.
readback_limit_snap_rad: 0.01
# Start-state phải khớp state thật trong dung sai này, không thì trajectory giật về point 0.
start_state_tol_rad: 0.05
# Bước nhảy joint giữa 2 waypoint kề (phát hiện branch jump / IK đổi nhánh).
max_joint_step_rad: 0.6
# Branch jump P2 của chess pipeline (so endpoint 2 vòng bù).
place_branch_jump_rad: 0.5

# Tốc độ commissioning. Đừng bao giờ bắt đầu 100%.
velocity_scaling_default: 0.1
velocity_scaling_max_hw: 0.25   # trần cứng tay thật (sim + fast_demo cũng không vượt khi gửi HW)
acceleration_scaling_default: 0.1
acceleration_scaling_max_hw: 0.25
# joint_limits.yaml đang để max_velocity 2.0 rad/s -> tốc độ thật = 2.0 * scaling.
max_velocity_rad_s: 2.0
# Ước lượng vận tốc từ waypoint (diff pos/dt); chặn nếu vượt max_velocity*scaling.
# Gia tốc ước lượng tương tự; commissioning chặn spike > ngưỡng này.
max_accel_rad_s2: 4.0

# /joint_states (hoặc servo readback) coi là stale sau cửa sổ này.
joint_state_max_age_sec: 1.0
# Sau execute, khớp phải về endpoint trong dung sai này (so với state MỚI).
execute_endpoint_tol_rad: 0.08
# Tracking error khi monitor readback: vượt là STOP.
tracking_error_stop_rad: 0.15
# Timeout chờ servo tới điểm (tính theo time_ms + margin).
execute_timeout_margin_sec: 5.0

# Arm_Lib time_ms cho mỗi lần write6. Để CAO khi test thật (chạy chậm, êm).
arm_lib_time_ms_commissioning: 2000
arm_lib_time_ms_normal: 1000
arm_lib_time_ms_min: 500   # cấm thấp hơn khi mang tải / gần bàn

# Cổng calibration — CHƯA đo thì chặn gửi HW (fail-loud), sim vẫn chạy.
tcp_offset_calibrated: false
# OFFSET = measured_tcp_z - BOARD_TOP_Z - PIECE_GRASP_HEIGHT[type]. Đo xong điền số + bật true.
tcp_to_contact_offset_z: 0.039   # giá trị SIM tạm (55-5-11mm); robot thật phải đo lại
gripper_calibrated: false
# Bảng joint(rad) -> inner width(m), sorted theo joint. Trống = giữ binary open/close.
gripper_calibration_table: []

# HOME an toàn: không singularity, không sát bàn, đi tới được từ phần lớn workspace.
# = HOME_JOINTS của chess pipeline (rad) <-> servo 90,90,90,90,90 + grip mở (servo 30).
safe_home_rad:
  arm1_Joint: 0.0
  arm2_Joint: 0.0
  arm3_Joint: 0.0
  arm4_Joint: 0.0
  arm5_Joint: 0.0
  Rlink1_Joint: 0.0
safe_home_servo_deg: [90.0, 90.0, 90.0, 90.0, 90.0, 30.0]

# Gripper binary an toàn (rad Rlink1). Cấm nội suy tuyến tính mm->rad (mimic phi tuyến).
gripper_open_rad: 0.0
gripper_close_rad: 1.57
# Gripper 3 mức tương lai (mm inner width) — chỉ dùng sau khi có bảng FK thật.
gripper_widths_mm:
  high_approach: 20.0
  narrow_descent: 14.0
  final_grasp: 12.0

# PlanningScene tối thiểu cho tay thật (MoveIt chỉ tránh thứ nó biết).
required_scene_objects:
  - chessboard
  - table
# Clearance hình học cộng thêm quanh obstacle thật (sai số TF/backlash/URDF vài mm).
collision_extra_margin_m: 0.005
